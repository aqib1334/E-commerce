    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #f0f4f8; /* Light background */
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Custom animations for better UX */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.6s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes modalIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-modal-in {
            animation: modalIn 0.3s ease-out forwards;
        }

        /* Order Confirmation Tick Animation */
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #fff;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #fff;
            fill: none;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        @keyframes scaleIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        .checkmark-svg {
            animation: scaleIn 0.5s cubic-bezier(0.65, 0, 0.45, 1) 0.3s forwards;
            transform: scale(0); /* Start scaled down */
        }
    </style>

        let selectedCategory = null;

        // Admin password for demo purposes (In a real app, this would be secured differently)

        // Firebase variables
        let app;
        let db;
        let auth;
        let userId = null; // Stores Firebase user UID
        let userEmail = null; // Stores Firebase user email

        // --- DOM Elements ---
        const contentArea = document.getElementById('content-area');
        const productDetailModal = document.getElementById('product-detail-modal');
        const modalContent = document.getElementById('modal-content');
        const cartItemCount = document.getElementById('cart-item-count');
        const authButtonsContainer = document.getElementById('auth-buttons');

        // --- Firebase Initialization ---
        window.onload = async function() {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        userEmail = user.email;
                        console.log("Firebase User ID:", userId, "Email:", user.email);
                        // In a real app, you'd fetch user-specific data (e.g., cart) here
                        // Example: onSnapshot(doc(db, `artifacts/${appId}/users/${userId}/cart`), (docSnap) => { ... });
                    } else {
                        userId = null;
                        userEmail = null;
                        console.log("No Firebase user signed in.");
                    }
                    renderAuthButtons(); // Update auth buttons based on login state
                    renderPage(currentPage); // Re-render current page to reflect auth state if needed
                });

                // Attempt anonymous sign-in if no user is logged in initially
                if (!auth.currentUser && typeof __initial_auth_token !== 'undefined') {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (error) {
                        console.error("Firebase custom token sign-in error:", error);
                    }
                } else if (!auth.currentUser) {
                     try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Firebase anonymous sign-in error:", error);
                    }
                }

            } else {
                console.warn("Firebase config not provided. Running in demo mode without persistence or full authentication.");
                // Render auth buttons even without Firebase for a basic UI
                renderAuthButtons();
            }

            // Initial render
            renderPage(currentPage);
            updateCartCountDisplay();
            lucide.createIcons(); // Initialize Lucide icons
        };

        // --- Utility Functions ---

        /**
         * Displays a temporary alert message on the screen.
         * @param {string} message - The message to display.
         * @param {string} type - 'success' for green, 'error' for red.
         */
        function alertMessage(message, type = 'success') {
            const alertBox = document.createElement('div');
            alertBox.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg text-white z-50 transition-transform transform ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} translate-x-0 opacity-100`;
            alertBox.textContent = message;
            document.body.appendChild(alertBox);

            setTimeout(() => {
                alertBox.classList.add('translate-x-full', 'opacity-0');
                alertBox.addEventListener('transitionend', () => alertBox.remove());
            }, 3000);
        }

        /**
         * Formats a number as PKR currency.
         * @param {number} amount - The amount to format.
         * @returns {string} Formatted currency string.
         */
        function formatPKR(amount) {
            return new Intl.NumberFormat('en-PK', {
                style: 'currency',
                currency: 'PKR',
                minimumFractionDigits: 0, // PKR usually doesn't use decimals for small amounts
                maximumFractionDigits: 0
            }).format(amount);
        }

        /**
         * Updates the display of the total items in the cart in the header.
         */
        function updateCartCountDisplay() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalItems > 0) {
                cartItemCount.textContent = totalItems;
                cartItemCount.classList.remove('hidden');
            } else {
                cartItemCount.classList.add('hidden');
            }
        }

        /**
         * Generates a unique ID for new products.
         * @returns {string} A unique product ID.
         */
        function generateProductId() {
            return 'p' + (products.length > 0 ? Math.max(...products.map(p => parseInt(p.id.substring(1).replace('p', '')))) + 1 : 1);
        }

        // --- Cart Management Functions ---

        /**
         * Adds a product to the cart or increments its quantity if already present.
         * @param {object} product - The product object to add.
         */
        function addToCart(product) {
            const existingItem = cart.find(item => item.id === product.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartCountDisplay();
            alertMessage(`${product.name} added to cart!`);
            // In a real app, update Firestore cart here
            // if (db && userId) { setDoc(doc(db, `artifacts/${appId}/users/${userId}/cart`, product.id), { quantity: existingItem ? existingItem.quantity : 1 }); }
        }

        /**
         * Updates the quantity of a product in the cart.
         * Removes the item if quantity is 0 or less.
         * @param {string} productId - The ID of the product.
         * @param {number} newQuantity - The new quantity.
         */
        function updateCartQuantity(productId, newQuantity) {
            if (newQuantity <= 0) {
                cart = cart.filter(item => item.id !== productId);
            } else {
                const item = cart.find(item => item.id === productId);
                if (item) {
                    item.quantity = newQuantity;
                }
            }
            updateCartCountDisplay();
            renderCartPage(); // Re-render cart to reflect changes
            // In a real app, update Firestore cart here
            // if (db && userId) {
            //     if (newQuantity <= 0) { deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/cart`, productId)); }
            //     else { setDoc(doc(db, `artifacts/${appId}/users/${userId}/cart`, productId), { quantity: newQuantity }); }
            // }
        }

        /**
         * Removes a product entirely from the cart.
         * @param {string} productId - The ID of the product to remove.
         */
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartCountDisplay();
            renderCartPage(); // Re-render cart
            alertMessage('Item removed from cart.', 'error');
            // In a real app, delete from Firestore cart here
            // if (db && userId) { deleteDoc(doc(db, `artifacts/${appId}/users/${userId}/cart`, productId)); }
        }

        /**
         * Clears all items from the cart.
         */
        function clearCart() {
            cart = [];
            updateCartCountDisplay();
            // In a real app, clear Firestore cart here
            // if (db && userId) { // Implement batch delete or collection clear logic }
        }

        /**
         * Handles user login with email and password.
         * @param {string} email
         * @param {string} password
         */
        
        async function handleLogin(email, password) {
            try {
                if (!auth) {
                    alertMessage("Firebase not initialized. Cannot log in.", "error");
                    return;
                }
                await signInWithEmailAndPassword(auth, email, password);
                alertMessage("Logged in successfully!");
                renderPage('home'); // Redirect to home after login
            } catch (error) {
                console.error("Login error:", error);
                alertMessage(`Login failed: ${error.message}`, "error");
            }
        }

        /**
         * Handles user registration with email and password.
         * @param {string} email
         * @param {string} password
         */
        async function handleSignUp(email, password) {
            try {
                if (!auth) {
                    alertMessage("Firebase not initialized. Cannot sign up.", "error");
                    return;
                }
                await createUserWithEmailAndPassword(auth, email, password);
                alertMessage("Account created successfully! You are now logged in.");
                renderPage('home'); // Redirect to home after sign up
            } catch (error) {
                console.error("Sign up error:", error);
                alertMessage(`Sign up failed: ${error.message}`, "error");
            }
        }

        /**
         * Handles user logout.
         */
        async function handleLogout() {
            try {
                if (!auth) {
                    alertMessage("Firebase not initialized. Cannot log out.", "error");
                    return;
                }
                await signOut(auth);
                isAdminAuthenticated = false; // Reset admin auth on user logout
                alertMessage("Logged out successfully!");
                renderPage('home'); // Redirect to home after logout
            } catch (error) {
                console.error("Logout error:", error);
                alertMessage(`Logout failed: ${error.message}`, "error");
            }
        }

         * Renders the specified page by updating the main content area.
         * @param {string} pageName - The name of the page to render ('home', 'categories', 'products', 'cart', 'payment', 'order-confirmation', 'admin', 'login', 'signup', 'admin-auth').
         */
        function renderPage(pageName) {
            currentPage = pageName;
            contentArea.innerHTML = ''; // Clear previous content
            productDetailModal.classList.add('hidden'); // Hide modal when changing pages

            switch (currentPage) {
                case 'home':
                    renderHomePage();
                    break;
                case 'categories':
                    renderCategoriesPage();
                    break;
                case 'products':
                    renderProductListPage();
                    break;
                case 'cart':
                    renderCartPage();
                    break;
                case 'payment':
                    renderPaymentPage();
                    break;
                case 'order-confirmation':
                    renderOrderConfirmationPage();
                    break;
                case 'admin':
                    // Check admin password before rendering the actual admin panel
                    if (isAdminAuthenticated) {
                        renderAdminPanel();
                    } else {
                        renderAdminAuthPage();
                    }
                    break;
                case 'login':
                    renderLoginPage();
                    break;
                case 'signup':
                    renderSignUpPage();
                    break;
                case 'admin-auth': // Explicitly render admin auth page
                    renderAdminAuthPage();
                    break;
                default:
                    renderHomePage();
            }
            // Re-initialize Lucide icons for newly rendered content
            lucide.createIcons();
        }
